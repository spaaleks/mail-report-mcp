integration-test:
  stage: test
  image: docker:latest
  variables:
    COMPOSE_PROJECT_NAME: "mail-report-test-$CI_JOB_ID"
  before_script:
    - apk add --no-cache docker-cli-compose
  script:
    - sh scripts/run-integration-test.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - artifacts/
    reports:
      junit: artifacts/junit.xml
  rules:
    - exists:
        - docker-compose.test.yml
