services:
    mail-report-mcp:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        environment:
            MCP_PORT: "8000"
            MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN}"
            MCP_LOG_LEVEL: "INFO"
            SMTP_HOST: "${SMTP_HOST}"
            SMTP_PORT: "${SMTP_PORT}"
            SMTP_USER: "${SMTP_USER}"
            SMTP_PASS: "${SMTP_PASS}"
            SMTP_FROM: "${SMTP_FROM}"
            SMTP_TO: "${SMTP_TO}"
            SMTP_SECURITY: "${SMTP_SECURITY}"
        volumes:
            - ./data:/data
        networks:
            - mcp-network

networks:
    mcp-network:
        external: true
