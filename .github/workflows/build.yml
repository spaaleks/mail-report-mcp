name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - dev
    tags:
      - '*'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run ruff
        run: uvx ruff check --output-format=github src/ tests/

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run the integration suite
        run: sh scripts/run-integration-test.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: artifacts/

      - name: Publish the test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Integration Tests
          path: artifacts/junit.xml
          reporter: java-junit

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mail-report-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          set -euo pipefail

          docker run -d --name smoke -p 8000:8000 \
            -e MCP_AUTH_TOKEN=smoke-token \
            -e SMTP_HOST=smtp.invalid \
            -e SMTP_FROM=reports@example.test \
            mail-report-mcp:ci

          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz >/dev/null && break
            sleep 1
          done

          health="$(curl -sf http://127.0.0.1:8000/healthz)"
          echo "$health"
          echo "$health" | grep -q '"smtp_configured":true' \
            || { echo "SMTP config did not resolve"; exit 1; }

          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/mcp)"
          [ "$code" = "401" ] || { echo "expected 401 on /mcp without a token, got $code"; exit 1; }

          uid="$(docker run --rm --entrypoint id mail-report-mcp:ci -u)"
          [ "$uid" = "10001" ] || { echo "expected uid 10001, got $uid"; exit 1; }

          docker inspect --format '{{.Config.Healthcheck.Test}}' mail-report-mcp:ci \
            | grep -q healthz || { echo "image has no healthcheck"; exit 1; }

      - name: Container logs
        if: always()
        run: docker logs smoke || true
